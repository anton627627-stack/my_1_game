<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Моя первая игра</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; color: #fff; font-family: sans-serif; user-select: none; }
        canvas { display: block; background: #000; }
        #info { position: absolute; top: 10px; left: 10px; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; display: none; }
        #menu { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        .btn { background: #00FF7F; color: black; border: none; padding: 15px 40px; font-size: 24px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 25px; transition: background 0.1s; }
        .btn:hover { background: #00CC66; }
        #restart-btn { position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
</head>
<body>
    <div id="menu">
        <h1 style="font-size: 50px; color: #00FF7F; margin: 0;">МОЯ ПЕРВАЯ ИГРА</h1>
        <p style="font-size: 18px; color: #aaa; margin-top: 10px;">Управление: Ц, Ф, Ы, В | Стрельба: Клик мыши</p>
        <button class="btn" id="play-btn">ИГРАТЬ</button>
    </div>

    <div id="info">ROUND: <span id="r">1</span> | ENEMIES: <span id="e">0</span> | PLAYER HP: <span id="hp">50</span>/50</div>
    <button class="btn" id="restart-btn">ЗАНОВО</button>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const menu = document.getElementById("menu"), playBtn = document.getElementById("play-btn"), restartBtn = document.getElementById("restart-btn"), infoPanel = document.getElementById("info");

        let player = { x: canvas.width/2, y: canvas.height/2, size: 25, speed: 5, hp: 50 }, enemies = [], bullets = [], enemyBullets = [], keys = {}, round = 1, state = 0;
        let stars = []; for (let i = 0; i < 100; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, s: 0.05+Math.random()*0.15 });

        function start(r) {
            enemies = []; bullets = []; enemyBullets = []; document.getElementById("r").innerText = r === 10 ? "10 (BOSS!)" : r;
            if (r <= 9) {
                for (let i = 0; i < 5 + r * 2; i++) enemies.push({ x: Math.random()*(canvas.width-100)+50, y: Math.random()*(canvas.height-150)+75, size: 30, hp: r, max: r, s: 1+Math.random()*1.5, t: Math.random()*200, boss: false });
            } else {
                enemies.push({ x: canvas.width/2, y: 150, size: 100, hp: 100, max: 100, s: 1.5, t: 0, boss: true });
            }
            document.getElementById("e").innerText = enemies.length; document.getElementById("hp").innerText = player.hp;
        }

        playBtn.onclick = () => { menu.style.display = "none"; infoPanel.style.display = "block"; start(1); loop(); };
        restartBtn.onclick = () => window.location.reload();

        window.onkeydown = (e) => { let k = e.key.toLowerCase(); if (k==='ц'||k==='w') keys['w']=true; if (k==='ы'||k==='s') keys['s']=true; if (k==='ф'||k==='a') keys['a']=true; if (k==='в'||k==='d') keys['d']=true; };
        window.onkeyup = (e) => { let k = e.key.toLowerCase(); if (k==='ц'||k==='w') keys['w']=false; if (k==='ы'||k==='s') keys['s']=false; if (k==='ф'||k==='a') keys['a']=false; if (k==='в'||k==='d') keys['d']=false; };
        let mx = 0, my = 0; window.onmousemove = (e) => { mx = e.clientX; my = e.clientY; };
        
        // СТРЕЛЬБА ИСПРАВЛЕНА: Теперь работает только во время матча (menu скрыто)
        window.onmousedown = () => { if (menu.style.display === "none" && state === 0) { let a = Math.atan2(my - player.y, mx - player.x); bullets.push({ x: player.x, y: player.y, vx: Math.cos(a)*12, vy: Math.sin(a)*12 }); } };

        function loop() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "#fff";
            stars.forEach(s => { s.y += s.s; if (s.y > canvas.height) { s.y = 0; s.x = Math.random()*canvas.width; } ctx.fillRect(s.x, s.y, s.size, s.size); });

            if (state !== 0) {
                ctx.fillStyle = state === 1 ? "#0f0" : "#f33"; ctx.font = "bold 50px Arial"; ctx.textAlign = "center";
                ctx.fillText(state === 1 ? "YOU WIN! BOSS DESTROYED!" : "GAME OVER! YOU DIED!", canvas.width/2, canvas.height/2 - 40);
                ctx.fillStyle = "#fff"; ctx.font = "30px Arial"; ctx.fillText("Понравилась игра?", canvas.width/2, canvas.height/2 + 30);
                restartBtn.style.display = "block"; return;
            }

            if (keys['w'] && player.y > 20) player.y -= player.speed; if (keys['s'] && player.y < canvas.height-20) player.y += player.speed;
            if (keys['a'] && player.x > 20) player.x -= player.speed; if (keys['d'] && player.x < canvas.width-20) player.x += player.speed;

            for (let i = bullets.length-1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy; if (b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height) { bullets.splice(i,1); continue; }
                for (let j = 0; j < enemies.length; j++) { let en = enemies[j]; if (en.hp > 0 && Math.sqrt((b.x-en.x)**2 + (b.y-en.y)**2) < en.size/2 + 3) { en.hp--; bullets.splice(i,1); break; } }
            }
            for (let i = enemyBullets.length-1; i >= 0; i--) {
                let eb = enemyBullets[i]; eb.x += eb.vx; eb.y += eb.vy; if (eb.x<0||eb.x>canvas.width||eb.y<0||eb.y>canvas.height) { enemyBullets.splice(i,1); continue; }
                if (Math.sqrt((eb.x-player.x)**2 + (eb.y-player.y)**2) < player.size/2 + 4) { player.hp -= eb.d; if (player.hp < 0) player.hp = 0; document.getElementById("hp").innerText = player.hp; enemyBullets.splice(i,1); if (player.hp <= 0) state = 2; continue; }
            }
            enemies.forEach(en => {
                if (en.hp <= 0) return; let a = Math.atan2(player.y - en.y, player.x - en.x); en.x += Math.cos(a)*en.s; en.y += Math.sin(a)*en.s; en.t++;
                if (en.t >= (en.boss ? 45 : 200)) { en.t = 0; enemyBullets.push({ x: en.x, y: en.y, vx: Math.cos(a)*(en.boss ? 4.5 : 3), vy: Math.sin(a)*(en.boss ? 4.5 : 3), d: en.boss ? 10 : 1 }); }
            });

            if (!enemies.some(en => en.hp > 0)) { if (round < 10) { round++; start(round); } else state = 1; }
            document.getElementById("e").innerText = enemies.filter(en => en.hp > 0).length;
            
            ctx.fillStyle = "#0f7"; ctx.fillRect(player.x-player.size/2, player.y-player.size/2, player.size, player.size);
            bullets.forEach(b => { ctx.fillStyle = "#0ff"; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill(); });
            enemyBullets.forEach(eb => { ctx.fillStyle = eb.d === 10 ? "#d0f" : "#ffaa00"; ctx.beginPath(); ctx.arc(eb.x,eb.y,eb.d===10?10:6,0,7); ctx.fill(); });
            enemies.forEach(en => {
                if (en.hp <= 0) return; ctx.fillStyle = en.boss ? "#a0f" : "#f33"; ctx.fillRect(en.x-en.size/2, en.y-en.size/2, en.size, en.size);
                ctx.fillStyle = "#555"; ctx.fillRect(en.x-en.size/2, en.y-en.size/2-10, en.size, 5); ctx.fillStyle = "#f00"; ctx.fillRect(en.x-en.size/2, en.y-en.size/2-10, en.size*(en.hp/en.max), 5);
            });
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
